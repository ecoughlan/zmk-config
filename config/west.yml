# West manifest for Toucan ZMK configuration
# Merges: ZMK core, Toucan shield, urob's modules, Cirque trackpad support
#
# Everything tracks branches (no pinned revisions). The workspace has four
# toplevel directories (config, modules, zephyr, zmk); create it with:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
---
manifest:
  defaults:
    remote: urob
    revision: main
  # nanopb (ZMK Studio) lives in Zephyr's optional group
  group-filter: [+optional]
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: ecoughlan
      url-base: https://github.com/ecoughlan
  projects:
    # Core ZMK - main branch for ZMK Studio and latest features
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Toucan shield definitions (fork with LVGL v9 fixes)
    - name: zmk-keyboard-toucan
      remote: ecoughlan
      revision: main
    # Note: Cirque trackpad support is built into Zephyr (cirque,pinnacle)
    # urob's ZMK modules for advanced behaviors
    - name: zmk-helpers
      path: modules/zmk/helpers
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
    - name: zmk-tri-state
      path: modules/zmk/tri-state
    # Avoid downloading GBs of unused Zephyr modules. Remove this section to
    # restore the default (needed for less common hardware).
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - hal_stm32  # imported independently by ZMK
          - lvgl  # imported independently by ZMK
          - mbedtls
          - nanopb  # ZMK Studio
          - tinycrypt
  self:
    path: config
